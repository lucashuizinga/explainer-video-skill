<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- the voice clock: data written by tools/sync.mjs, then the timeline you edit -->
    <script src="assets/vo/data.js"></script>
    <script src="lib/clock.js"></script>
    <script src="timeline.js"></script>
    <script src="lib/kit.js"></script>
    <style>
      /* fonts:start */
      @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 300 700; font-display: block; src: url("assets/fonts/space-grotesk-300-700-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 300 700; font-display: block; src: url("assets/fonts/space-grotesk-300-700-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* fonts:end */

      /* ---------------------------------------------------------------------------------------
         The brand: every colour and typeface in the film comes from here.
         Replace these with the company's real values (see references/brand.md in the skill).
         --------------------------------------------------------------------------------------- */
      :root {
        --bg: #f6f4ef; /* the page the film sits on */
        --surface: #ffffff; /* cards and panels */
        --ink: #17202a; /* text and outlines */
        --ink-soft: #5b6673; /* secondary text */
        --line: #dfe3e8; /* hairlines */
        --accent: #e4572e; /* the one brand colour that carries emphasis */
        --accent-2: #2f7f6f; /* a second brand colour, used sparingly */
        --accent-soft: #fbe1d8; /* a tint of the accent for large quiet shapes */
        --on-accent: #ffffff; /* text on the accent */
        --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif; /* headlines and big words */
        --font-body: "Inter", "Helvetica Neue", Arial, sans-serif; /* labels and small text */
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-display);
        font-weight: 700;
      }

      /* ---- building blocks shared by every scene ---- */

      /* A point on the frame. Its content is centred on that point, and scales and turns around it. */
      .at {
        position: absolute;
        width: 0;
        height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .at > * {
        flex: none;
        white-space: nowrap;
      }
      /* A line whose words light up as they are spoken: one .w per word. */
      .w {
        display: inline-block;
      }
      /* A solid rounded label. */
      .label {
        height: 1.72em;
        padding: 0 0.575em;
        border-radius: 0.3em;
        background: var(--accent);
        color: var(--on-accent);
        font-size: 48px;
        line-height: 1.72em;
      }
      /* A white panel with a soft shadow. */
      .panel {
        border-radius: 28px;
        background: var(--surface);
        box-shadow: 0 22px 48px rgba(23, 32, 42, 0.14);
      }
      /* A picture seen through a camera: zoom --z around the point (--px, --py) of the picture.
         Everything inside moves with it. Tween the three variables with FILM.view(z, px, py). */
      .cam {
        --z: 1;
        --px: 960;
        --py: 540;
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 0 0;
        transform: translate(calc((960 - var(--px) * var(--z)) * 1px), calc((540 - var(--py) * var(--z)) * 1px)) scale(var(--z));
      }
      .cam > img {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
      }
      /* A point on the picture that keeps its content the same size on screen while the camera zooms. */
      .cam .pin {
        position: absolute;
        width: 0;
        height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: scale(calc(1 / var(--z)));
      }
      .cam .pin > * {
        flex: none;
        white-space: nowrap;
      }
      /* A coloured panel that crosses the frame to hide a cut: FILM.cutOut in the scene that ends, FILM.cutIn in
         the next. The .cut around it is a timed clip, so the panel only exists during the cut. */
      .cut {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .sweep {
        position: absolute;
        inset: 0;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-at="0" data-until="END" data-start="0" data-duration="22.08" data-width="1920" data-height="1080">
      <!-- ---------- scenes, back to front. Starts and ends are moments from timeline.js ---------- -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-at="T.hook" data-until="T.picture" data-start="0" data-duration="10.34"
        data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>

      <div id="picture" data-composition-id="picture" data-composition-src="compositions/picture.html"
        data-at="T.picture" data-until="T.close" data-start="10.34" data-duration="5.02"
        data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>

      <div id="close" data-composition-id="close" data-composition-src="compositions/close.html"
        data-at="T.close" data-until="END" data-start="15.36" data-duration="6.72"
        data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>


      <!-- ---------- sound ---------- -->
      <!-- the voice: written by tools/sync.mjs, one clip per spoken part -->
      <!-- voice:start -->
      <audio id="vo-s1-1" class="clip" src="assets/vo/s1.mp3" data-start="0.8" data-duration="4.45" data-media-start="0" data-volume="1" data-track-index="10"></audio>
      <audio id="vo-s1-2" class="clip" src="assets/vo/s1.mp3" data-start="5.75" data-duration="4.35" data-media-start="4.45" data-volume="1" data-track-index="10"></audio>
      <audio id="vo-s2-1" class="clip" src="assets/vo/s2.mp3" data-start="10.84" data-duration="4.48" data-media-start="0" data-volume="1" data-track-index="10"></audio>
      <audio id="vo-s3-1" class="clip" src="assets/vo/s3.mp3" data-start="15.86" data-duration="3.04" data-media-start="0" data-volume="1" data-track-index="10"></audio>
      <!-- voice:end -->

      <!-- the music bed from tools/mix_music.py: its level is baked in, so it plays at full volume -->
      <audio id="music" class="clip" src="assets/music/bed.mp3" data-at="0" data-until="END" data-start="0" data-duration="22.08" data-volume="1" data-track-index="11"></audio>

      <!-- sound effects hang on the same words as the picture -->
      <audio id="sfx-title" class="clip" src="assets/sfx/pop.mp3" data-at="at('This is a template')" data-start="1.08" data-duration="0.48" data-db="-13" data-volume="0.224" data-track-index="12"></audio>
      <audio id="sfx-word" class="clip" src="assets/sfx/tick.mp3" data-at="at('hangs on a word', 1, 3)" data-start="4.56" data-duration="1" data-db="-15" data-volume="0.178" data-track-index="12"></audio>
      <audio id="sfx-first" class="clip" src="assets/sfx/pluck.mp3" data-at="at('First the voice')" data-start="6.02" data-duration="0.48" data-db="-14" data-volume="0.2" data-track-index="12"></audio>
      <audio id="sfx-then" class="clip" src="assets/sfx/pluck.mp3" data-at="at('Then the timing')" data-start="7.58" data-duration="0.48" data-db="-14" data-volume="0.2" data-track-index="12"></audio>
      <audio id="sfx-last" class="clip" src="assets/sfx/pluck.mp3" data-at="at('Then the shots')" data-start="9.02" data-duration="0.48" data-db="-14" data-volume="0.2" data-track-index="12"></audio>
      <audio id="sfx-cut-1" class="clip" src="assets/sfx/whoosh.mp3" data-at="T.picture - 0.25" data-start="10.09" data-duration="0.8" data-db="-13" data-volume="0.224" data-track-index="12"></audio>
      <audio id="sfx-illustration" class="clip" src="assets/sfx/pop.mp3" data-at="at('illustrations')" data-start="12.06" data-duration="0.48" data-db="-15" data-volume="0.178" data-track-index="12"></audio>
      <audio id="sfx-camera" class="clip" src="assets/sfx/pop.mp3" data-at="at('the camera', 1, 1)" data-start="13.56" data-duration="0.48" data-db="-15" data-volume="0.178" data-track-index="12"></audio>
      <audio id="sfx-cut-2" class="clip" src="assets/sfx/whoosh.mp3" data-at="T.close - 0.25" data-start="15.11" data-duration="0.8" data-db="-13" data-volume="0.224" data-track-index="12"></audio>
      <audio id="sfx-close" class="clip" src="assets/sfx/chime.mp3" data-at="T.close + 0.35" data-start="15.71" data-duration="1.48" data-db="-14" data-volume="0.2" data-track-index="13"></audio>
    </div>

    <script>
      // The root holds only scenes and sound, so its own timeline stays empty.
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
